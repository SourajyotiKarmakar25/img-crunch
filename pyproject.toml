
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "img-crunch"
version = "0.1.0"
description = "A Python utility for image color quantization using K-Means clustering."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "Pillow>=11.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.9"
]

[project.scripts]
imgquant = "imgquant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py312"
